<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>skolestudio</title>
    <style>
        :root {
            --bg-color: #2C9470;
            --text-color: #ffffff;
            --border-glow: #00c6ff;
            --system-icon-bg: #444444;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            user-select: none;
        }

        /* Topplinje med brukerikon og klokke */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 60px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 45px;
            height: 45px;
            background-color: #ff4500;
            border-radius: 50%;
            border: 2px solid #fff;
        }

        .status-icons {
            font-size: 18px;
            color: #888;
            display: flex;
            gap: 15px;
        }

        /* Hovedkarusell for spill (Horisontal scroll) */
        .main-menu {
            display: flex;
            align-items: center;
            padding: 0 60px;
            overflow-x: auto;
            gap: 20px;
            scroll-behavior: smooth;
            flex-grow: 1;
        }

        /* Skjuler scrollbar, men beholder funksjonalitet */
        .main-menu::-webkit-scrollbar {
            display: none;
        }

        .game-card {
            flex: 0 0 240px;
            height: 240px;
            background-color: #3c3c3c;
            border-radius: 0px; /* Switch bruker helt skarpe kanter */
            box-sizing: border-box;
            border: 4px solid transparent;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            text-decoration: none;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Hovedeffekten når du holder musen over (eller velger) et spill */
        .game-card:hover {
            transform: scale(1.08);
            border-color: var(--border-glow);
            box-shadow: 0 0 20px rgba(0, 198, 255, 0.6);
            z-index: 10;
        }

        .game-art {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-color: #1e1e1e;
        }

        /* Viser spilltittel over kortet når man hoover (valgfritt) */
        .game-title-display {
            position: absolute;
            top: 90px;
            left: 60px;
            font-size: 28px;
            font-weight: bold;
            color: #fff;
            opacity: 0.9;
        }

        /* Systemknapper på bunnen (Nintendo-stil) */
        .bottom-bar {
            display: flex;
            justify-content: center;
            gap: 25px;
            padding-bottom: 40px;
            border-top: 2px solid #3a3a3a;
            padding-top: 20px;
        }

        .system-button {
            width: 50px;
            height: 50px;
            background-color: var(--system-icon-bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            border: 2px solid transparent;
        }

        .system-button:hover {
            transform: scale(1.1);
            background-color: #555;
            border-color: #fff;
        }
    </style>
</head>
<body>

    <!-- Toppmeny -->
    <div class="top-bar">
        <div class="user-profile">
            <div class="avatar"></div>
            <span style="font-weight: bold;">Hitler and stalin</span>
        </div>
        <div class="status-icons">
            <span>📶</span>
            <span>100% 🔋</span>
            <span id="clock">21:34</span>
        </div>
    </div>

    <!-- Tittel på valgt spill -->
    <div class="game-title-display" id="game-title">Gamelibary</div>

    <!-- Horisontal Spillmeny -->
    <main class="main-menu">
        
        <!-- SPILL 1: Pokémon Emerald (GBA) -->
        <a href="webretro/?core=mgba&rom=../roms/Pokemon/Pokemonruby.gba" 
           class="game-card" 
           onmouseover="updateTitle('Pokémon ruby version')" 
           onmouseout="updateTitle('Spillbibliotek')">
            <!-- Erstatt url-en med sti til et lokalt bilde etterhvert -->
            <div class="game-art" style="background-image: url('https://archives.bulbagarden.net/media/upload/5/5f/Ruby_EN_boxart.png');"></div>
        </a>

        <!-- SPILL 2: Super Mario Bros (NES) -->
        <a href="webretro/?core=nestopia&rom=../roms/super_mario.nes" 
           class="game-card" 
           onmouseover="updateTitle('Super Mario Bros.')" 
           onmouseout="updateTitle('Spillbibliotek')">
            <div class="game-art" style="background-image: url('https://miro.medium.com/v2/0*6XckCr9kJtjidUMw');"></div>
        </a>

        <!-- SPILL 3: Chrono Trigger (SNES) -->
        <a href="webretro/?core=snes9x&rom=../roms/chrono_trigger.zip" 
           class="game-card" 
           onmouseover="updateTitle('Chrono Trigger')" 
           onmouseout="updateTitle('Spillbibliotek')">
            <div class="game-art" style="background-image: url('https://upload.wikimedia.org/wikipedia/en/8/84/Pok%C3%A9mon_Crystal_box_art.png?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original');"></div>
        </a>

        <!-- Du kan legge til så mange spillkort du vil her bortover -->

    </main>

    <!-- Systemikoner i bunn -->
    <footer class="bottom-bar">
        <div class="system-button" title="Nyheter">📰</div>
        <div class="system-button" title="Nintendo eShop">🛍️</div>
        <div class="system-button" title="Album">🖼️</div>
        <div class="system-button" title="Kontrollere">🎮</div>
        <div class="system-button" title="Systeminnstillinger">⚙️</div>
        <div class="system-button" title="Power">🛑</div>
    </footer>

    <script>
        // Dynamisk oppdatering av spilltittel på skjermen
        function updateTitle(title) {
            document.getElementById('game-title').innerText = title;
        }

        // Enkel klokkefunksjon for Switch-looken
        function updateClock() {
            const now = new Date();
            const time = now.toTimeString().substring(0, 5);
            document.getElementById('clock').innerText = time;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
